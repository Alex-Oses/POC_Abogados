<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICAT · Transcripció de documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500&display=swap" rel="stylesheet">
<style>
/* Base: CSS de maqueta/index.html */
:root{--p:#B2051B;--p-bg:#FBEDEF;--t:#212121;--m:#5E5E5E;--bg:#F6F5F3;--line:#E2DFDA;--ok:#1F7A3A;--ok-bg:#E6F4EA;--w:#8A5A00;--w-bg:#FFF4D6;--f:#0B5CAD}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Roboto,Arial,sans-serif;color:var(--t);background:var(--bg)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--f);outline-offset:2px}
header{background:#fff;border-bottom:2px solid var(--p);display:flex;align-items:center;gap:32px;padding:10px 28px}
.logo{line-height:1.1}.logo b{font:400 26px Georgia,serif;color:#6B6B6B;letter-spacing:1px}.logo b i{font-style:normal;color:var(--p)}
.logo small{display:block;font-size:11px;color:var(--m)}
nav{display:flex;gap:4px;flex:1}
nav a{font:500 13px "Roboto Condensed",Roboto,sans-serif;text-transform:uppercase;color:var(--m);text-decoration:none;padding:8px 12px;border-radius:4px;min-height:24px}
nav a.on{color:var(--p);background:var(--p-bg)}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{border:0;background:#fff;padding:4px 10px;font-size:12px;color:var(--m)}
.lang button.on{background:var(--t);color:#fff}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--m)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
main{max-width:1280px;margin:0 auto;padding:24px 28px 80px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{color:var(--m);font-size:13px;margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--t);border-radius:6px;padding:8px 14px;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:14px 18px}.kpi b{font-size:26px;font-weight:500;display:block}.kpi span{font-size:12px;color:var(--m)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--m);background:#fff;margin-bottom:16px;width:100%}
.drop b{color:var(--p)}
.drop.over{border-color:var(--p);background:var(--p-bg)}
table{width:100%;border-collapse:collapse}
th{font:500 11px Roboto;text-transform:uppercase;color:var(--m);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:#FAF9F7}
.doc-t{font-weight:500}.doc-s{font-size:12px;color:var(--m)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 10px;border-radius:12px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.w{background:var(--w-bg);color:var(--w)}.chip.bad{background:var(--p-bg);color:var(--p)}.chip.n{background:#EEE;color:var(--m)}
.bar{height:4px;background:#EEE;border-radius:2px;width:90px;margin-bottom:3px}.bar i{display:block;height:100%;background:var(--p);border-radius:2px}
.search{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font:inherit;background:#fff}
/* procesado */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:18px}
.tile{border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;text-align:center;background:#fff;min-height:84px}
.tile .pg{height:30px;margin:0 auto 6px;width:24px;background:repeating-linear-gradient(#ddd 0 2px,#fff 2px 5px);border:1px solid #ccc}
.tile.run{border-color:var(--p)}
/* revisión */
.rev{display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;height:calc(100vh - 210px);min-height:520px;grid-template-rows:minmax(0,1fr)}
.thumbs{overflow:auto;padding:8px}
.thumb{width:100%;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-size:12px}
.thumb.on{border:2px solid var(--p);background:var(--p-bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.ok{background:var(--ok)}.dot.w{background:#E0A100}.dot.bad{background:var(--p)}.dot.v{background:var(--ok);box-shadow:0 0 0 2px var(--ok-bg)}
.scan{background:#E9E7E3;overflow:auto;display:flex;justify-content:center;padding:18px}
.paper{background:#FDFCF9;width:100%;max-width:470px;padding:34px 30px;font:11px/1.6 Arial,sans-serif;color:#333;transform:rotate(-.5deg);box-shadow:0 1px 4px rgba(0,0,0,.2);filter:blur(.25px);background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:3px 3px}
.paper.ilegible{filter:blur(1.6px) contrast(.4);opacity:.6}
.paper h4{font-size:11px;margin:0 0 10px}
.text{overflow:auto;padding:20px 26px;font:15px/1.75 Georgia,serif}
.text h4{font:700 14px Georgia;margin:6px 0 14px}
.tool{display:flex;gap:10px;align-items:center;font:12px Roboto;color:var(--m);padding:8px 14px;border-bottom:1px solid var(--line)}
.doubt{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline wavy #E0A100 2px;text-underline-offset:4px;background-color:var(--w-bg)}
.invalid{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline solid var(--p) 2px;text-underline-offset:4px}
.fixed{background:var(--ok-bg);border-radius:3px}
.hl{border-radius:2px;transition:background .15s,box-shadow .15s}
.hl.on{box-shadow:0 0 0 3px currentColor;position:relative;z-index:1}
.hl-doubt.on{background:#FFE08A;color:var(--w)}.hl-invalid.on{background:#F7C6CD;color:var(--p)}
.pop{position:absolute;z-index:20;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:12px 14px;font:13px/1.5 Roboto;max-width:300px}
.pop b{display:block;margin-bottom:4px}
.pop .row{margin-top:8px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--m);padding:8px 2px}
.banner{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:10px}
.banner.bad{background:var(--p-bg);color:var(--p)}.banner.ok{background:var(--ok-bg);color:var(--ok)}.banner.w{background:var(--w-bg);color:var(--w)}
/* JG */
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
.check{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.check .ic{font-weight:700;width:18px;text-align:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px;padding:4px 18px 14px}.kv span{color:var(--m)}
.box-h{padding:14px 18px 6px;font-weight:500}
/* anonimización */
.anon{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.doc{padding:30px 36px;font:15px/1.9 Georgia,serif;min-height:520px}
.doc h4{font:700 14px Georgia;text-align:center;margin:0 0 18px}
.ent{font:inherit;color:inherit;background:none;border:0;padding:0 1px;cursor:pointer;border-radius:2px}
.ent.off{text-decoration:underline dashed #999 1px;text-underline-offset:4px}
.ent.m-censurar{background:#3A3A3A;color:transparent}
.ent.m-esborrar{color:transparent;background:repeating-linear-gradient(90deg,transparent 0 3px,#eee 3px 4px)}
.ent.m-tatxar{text-decoration:line-through 2px;background:#f2f2f2}
.ent.m-tag{background:#4A4A4A;color:#fff;font:600 11px Roboto;padding:1px 5px;letter-spacing:.3px}
.ent.orig{background:var(--w-bg)}
.ent.hlt{box-shadow:0 0 0 3px var(--p);border-radius:3px;position:relative;z-index:1}
.side{padding:16px}
.side h3{font-size:15px;font-weight:500;margin:0}
.side h5{font-size:12px;color:var(--m);font-weight:500;margin:16px 0 8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.modes button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 4px;font-size:12px}
.modes button.on{border-color:var(--p);background:var(--p-bg);color:var(--p);font-weight:500}
.cat{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.cat input{accent-color:var(--p);width:16px;height:16px}
.cat em{margin-left:auto;font-style:normal;color:var(--m)}
details{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:14px;font-size:13px}
details li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
details ul{list-style:none;padding:0;margin:8px 0 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:30}
.modal{background:#fff;border-radius:10px;padding:24px;width:480px;max-width:92vw}
.modal h2{font-size:18px;font-weight:500;margin:0 0 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:40}
.login{max-width:420px;margin:9vh auto;padding:36px;text-align:center}
.login .logo b{font-size:44px}
.audit{font:12px/1.7 ui-monospace,Consolas,monospace;color:var(--m);padding:12px 18px}
/* guía de la demo */
.guide{margin:12px 28px 0;text-align:right;font-size:13px}
.guide ol{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12px 14px 12px 32px;margin:0 0 8px;width:260px}
.guide li{padding:2px 0}.guide li a{color:var(--t);text-decoration:none}.guide li.on a{color:var(--p);font-weight:500}
.guide>button{float:right}
.ficticio{font-size:11px;color:var(--m);text-align:center;margin-top:24px}
/* Añadidos para la app real */
.logo-a{text-decoration:none}
.row.wrap{flex-wrap:wrap}
.btn.wide{width:100%;justify-content:center}
.fld{display:block;text-align:left;font-size:12px;color:var(--m);margin-bottom:12px}
.fld input{display:block;width:100%;margin-top:4px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.hero{padding:38px;margin-bottom:16px}
.hero h1{font-size:30px;line-height:1.25;margin:0 0 10px}
.hero .sub{font-size:15px;margin-bottom:18px;max-width:60ch}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.feat{padding:20px}.feat .big{font-size:26px;margin-bottom:8px}.feat p{margin:6px 0 0}
.mselect{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mopt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.mopt.on{border-color:var(--p);background:var(--p-bg)}
.mopt input{accent-color:var(--p);margin:0}
.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:16px 0 0}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--p-bg);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.dot.n{background:#D5D2CC}
.scan{align-items:flex-start}
.pimg{position:relative;display:inline-block;max-width:100%}
.pimg img{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pimg.outline{outline:3px solid var(--p);outline-offset:3px}
.pimg.ilegible img{opacity:.6}
.hlbox{position:absolute;border:2px solid var(--p);background:rgba(178,5,27,.18);border-radius:2px;pointer-events:none}
.rtxt{display:flex;flex-direction:column;position:relative;min-height:0}
.text{white-space:pre-wrap;flex:1;outline:none;min-height:0}
.text:focus{box-shadow:inset 0 0 0 2px var(--p-bg)}
.tool.foot{border-bottom:0;border-top:1px solid var(--line)}
.pimg.wait{animation:hlwait 1s ease-in-out infinite alternate}
@keyframes hlwait{from{outline:2px dashed transparent;outline-offset:3px}to{outline:2px dashed var(--p);outline-offset:3px}}
@media (prefers-reduced-motion:reduce){.pimg.wait{animation:none;outline:2px dashed var(--p);outline-offset:3px}}
.fmt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font:12px Roboto}
.fmt select,.fmt button,.fmt input[type=color]{height:28px;min-width:28px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--t);font:12px Roboto;cursor:pointer;padding:0 6px}
.fmt input[type=color]{padding:1px;width:28px}
.fmt button[aria-pressed=true]{background:var(--p-bg);border-color:var(--p);color:var(--p)}
.fmt button:focus-visible,.fmt select:focus-visible,.fmt input:focus-visible{outline:2px solid var(--f);outline-offset:1px}
.fmt :disabled{opacity:.45;cursor:not-allowed}
.fmt .sw{width:18px;height:18px;min-width:18px;padding:0;border-radius:50%}
.fmt .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
/* Diferencias de la doble lectura en ROJO (petición de Alex) */
.doubt{text-decoration:underline wavy var(--p) 2px;background-color:var(--p-bg);color:var(--p);cursor:pointer;border-radius:2px}
.invalid{cursor:pointer}
.doubt:focus,.invalid:focus{outline:2px solid var(--f);outline-offset:1px}
@media(max-width:900px){header{flex-wrap:wrap;gap:12px}.kpis{grid-template-columns:repeat(2,1fr)}.rev{grid-template-columns:1fr;height:auto}.thumbs{display:flex;gap:8px;overflow-x:auto}.thumb{min-width:110px}.grid2,.anon{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
/* Filtros y selección */
.fsel{width:auto;min-width:170px;flex:0 1 220px}
.rsel{width:17px;height:17px;accent-color:var(--p);cursor:pointer}
/* JG: lista de expedientes y vista previa */
.jgdoc{text-align:left;cursor:pointer;font:inherit;color:inherit}
.jgdoc:hover{border-color:var(--p)}
.check.click{cursor:pointer}.check.click:hover{background:#FAF9F7}
.jgprev{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:0 18px 18px;height:560px}
.jgthumbs{overflow:auto}
.jgthumbs .thumb img{width:34px;height:46px;object-fit:cover;border:1px solid var(--line);flex:none}
.jgprev .scan{border-radius:6px}
@media(max-width:900px){.jgprev{grid-template-columns:1fr;height:auto}.jgthumbs{display:flex;gap:8px;overflow-x:auto}.jgthumbs .thumb{min-width:150px}}
/* Animaciones: solo transform/opacity/colores (baratas, sin JS). Con reduce-motion se apagan. */
@keyframes in-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes in-fade{from{opacity:0}to{opacity:1}}
@keyframes in-pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes run-pulse{50%{box-shadow:0 0 0 4px var(--p-bg)}}
@keyframes shimmer{to{background-position:-200% 0}}
main{animation:in-up .28s ease-out}
.kpi,.hero,.feat{animation:in-up .35s ease-out both}
.kpi:nth-child(2),.feat:nth-child(2){animation-delay:.04s}.kpi:nth-child(3),.feat:nth-child(3){animation-delay:.08s}.kpi:nth-child(4),.feat:nth-child(4){animation-delay:.12s}
tbody tr{animation:in-fade .3s ease-out both}
tbody tr:nth-child(2){animation-delay:.03s}tbody tr:nth-child(3){animation-delay:.06s}tbody tr:nth-child(4){animation-delay:.09s}tbody tr:nth-child(n+5){animation-delay:.12s}
.btn,.mopt,.modes button,nav a,.lang button,.thumb,.tile,.card,.drop,.chip,.fmt button,.search,.fld input{transition:background-color .15s,border-color .15s,color .15s,box-shadow .2s,transform .15s}
.btn:not(:disabled):hover{border-color:#C9C5BE;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn.pri:not(:disabled):hover{background:#9A0417;border-color:#9A0417}
.btn:not(:disabled):active,.mopt:active,.modes button:active{transform:scale(.97)}
nav a:not(.on):hover{color:var(--t);background:#F3F1EE}
.kpi:hover,.feat:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
td{transition:background-color .15s}
.drop:hover{border-color:#C9C5BE}
.drop.over{transform:scale(1.01)}
.search:focus,.fld input:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-bg);outline:none}
.thumb:hover{border-color:#C9C5BE}
.tile{animation:in-pop .25s ease-out both}
.tile.run{animation:in-pop .25s ease-out both,run-pulse 1.4s ease-in-out infinite}
.bar i{transition:width .4s ease-out}
progress{accent-color:var(--p)}
.chip.n:first-child:has(+ div progress){background:linear-gradient(90deg,#EEE 0 40%,#F7F7F7 50%,#EEE 60%) 0 0/200% 100%;animation:shimmer 1.6s linear infinite}
.modal-bg{animation:in-fade .18s ease-out}
.modal{animation:in-pop .2s ease-out}
.pop{animation:in-pop .15s ease-out}
.toast{animation:toast-in .22s ease-out}
.hlbox{animation:in-pop .2s ease-out}
.banner,.guide ol,details[open] ul{animation:in-up .22s ease-out}
.login{animation:in-pop .35s ease-out}
.pimg img{animation:in-fade .3s ease-out}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .spin{animation-duration:3s!important;animation-iteration-count:infinite!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>window.onerror=(m)=>{document.getElementById('root').textContent='Error: '+m}</script>

<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/htm.umd.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
