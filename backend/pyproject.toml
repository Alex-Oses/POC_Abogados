[project]
name = "icat-backend"
version = "0.1.0"
description = "API de anonimización de documentos judiciales del ICAT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "pypdfium2>=4.30",
  "pillow>=10",
  "reportlab>=4.2",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "rapidocr-onnxruntime>=1.3",  # solo para situar palabras en escaneos
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["bd: necesita un PostgreSQL con V1..V15 aplicadas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008 es el idioma de FastAPI: Depends() en el valor por defecto.
ignore = ["B008"]
