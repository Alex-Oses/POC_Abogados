# Servidor completo (BD, OCR, app y HTTPS) sin scripts: solo Docker Compose.
#   Arrancar viendo todo:  docker compose -f docker-compose.servidor.yml up --build
#     -> los logs de todos los servicios salen en la terminal; si algo falla, ahí se ve.
#     -> cuando la app está lista, el servicio "aviso" imprime la URL y el usuario.
#     -> Ctrl+C lo para. Para dejarlo en segundo plano: el mismo comando con -d.
#   Ver logs luego:  docker compose -f docker-compose.servidor.yml logs -f app
#   Otro puerto: PUERTO=9443 en un fichero .env junto a este (por defecto 8443).
#   Borrar TODO, datos incluidos:  docker compose -f docker-compose.servidor.yml down -v
# OCR: usa el Ollama ya instalado en la VM (127.0.0.1:11434) con su modelo; OCR_MODEL en .env si se llama distinto.
# Claves y certificado se generan solos la primera vez y se guardan en el volumen icat_secretos.
name: icat

x-modelo: &modelo ${OCR_MODEL:-hf.co/PaddlePaddle/PaddleOCR-VL-1.6-GGUF:latest}

services:
  # Una vez: crea contraseñas, clave de cifrado y certificado propio si aún no existen.
  secretos:
    image: alpine:3.20
    restart: "no"
    volumes:
      - icat_secretos:/s
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /s/listo ]; then
          apk add --no-cache openssl >/dev/null
          head -c24 /dev/urandom | base64 | tr -dc A-Za-z0-9 > /s/db_password
          head -c18 /dev/urandom | base64 | tr -dc A-Za-z0-9 > /s/admin_password
          head -c32 /dev/urandom | base64 | tr '+/' '-_' > /s/storage_key
          openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj /CN=icat \
            -keyout /s/key.pem -out /s/cert.pem 2>/dev/null
          chmod 644 /s/*
          touch /s/listo
        fi
        echo "Secretos listos en el volumen icat_secretos"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /s/db_password
      POSTGRES_DB: icat
    ports:
      - "127.0.0.1:${DB_PUERTO:-5433}:5432"   # solo local; 5433 por si la VM ya tiene un PostgreSQL
    volumes:
      - ./docs/architecture:/migrations:ro
      - ./backend/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - icat_pg:/var/lib/postgresql/data
      - icat_secretos:/s:ro
    depends_on:
      secretos:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d icat"]
      interval: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENTORNO: produccion
      OLLAMA_URL: http://127.0.0.1:11434   # el Ollama ya instalado en la VM
      OCR_MODEL: *modelo
      STORAGE_DIR: /app/storage
      ADMIN_EMAIL: admin@icat.local
    # Las claves vienen del volumen de secretos; la IP real del usuario llega a la auditoría.
    command:
      - sh
      - -c
      - |
        export DATABASE_URL="postgresql://postgres:$$(cat /s/db_password)@127.0.0.1:${DB_PUERTO:-5433}/icat"
        export STORAGE_KEY="$$(cat /s/storage_key)" ADMIN_PASSWORD="$$(cat /s/admin_password)"
        exec uvicorn app.main:app --host 127.0.0.1 --port ${APP_PUERTO:-8001} --proxy-headers --forwarded-allow-ips 127.0.0.1
    network_mode: host   # para llegar al Ollama de la VM (solo escucha en localhost)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:${APP_PUERTO:-8001}/health', timeout=4).status != 200)"]
      interval: 10s
      start_period: 60s
      retries: 6
    volumes:
      - icat_storage:/app/storage
      - icat_secretos:/s:ro
    depends_on:
      db:
        condition: service_healthy

  # HTTPS con certificado propio en el puerto que esté abierto (el navegador avisa la primera vez).
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - icat_secretos:/s:ro
      - icat_caddy:/data
    command:
      - sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        :${PUERTO:-8443} {
        	tls /s/cert.pem /s/key.pem
        	encode gzip
        	header {
        		Strict-Transport-Security "max-age=31536000"
        		X-Content-Type-Options nosniff
        		X-Frame-Options DENY
        		Referrer-Policy no-referrer
        		-Server
        	}
        	request_body {
        		max_size 25MB
        	}
        	reverse_proxy 127.0.0.1:${APP_PUERTO:-8001}
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      - app

  # Cuando la app responde, imprime dónde entrar y con qué usuario.
  aviso:
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      PUERTO: ${PUERTO:-8443}
    volumes:
      - icat_secretos:/s:ro
    entrypoint:
      - sh
      - -c
      - |
        IP=$$(curl -fs --max-time 5 https://api.ipify.org || echo IP_DEL_SERVIDOR)
        echo "=================================================================="
        echo " LISTO. Abre en el navegador:  https://$$IP:$$PUERTO"
        echo " (aviso de certificado propio: Avanzado -> Continuar)"
        echo " Usuario: admin@icat.local   Contraseña: $$(cat /s/admin_password)"
        echo " Si la IP no es la buena, usa la IP pública de la VM en Azure."
        echo "=================================================================="
    depends_on:
      app:
        condition: service_healthy
      caddy:
        condition: service_started

volumes:
  icat_pg:
  icat_storage:
  icat_secretos:
  icat_caddy:
